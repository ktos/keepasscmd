name: Build and Release

on:
  pull_request:
  push:
    branches:
      - master

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
        dotnet-quality: preview

    - name: Build
      run: dotnet build -c Release -r win-${{ matrix.platform }} -p:Version=${{ env.VERSION }}

    - name: Publish
      if: github.event_name == 'push'
      run: dotnet publish -c Release -r win-${{ matrix.platform }} -f net11.0 -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o publish/win-${{ matrix.platform }}

    - name: Upload artifact for release job
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: keepasscmd-win-${{ matrix.platform }}
        path: publish/win-${{ matrix.platform }}/KeePassCmd.exe

  create_release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename executables
        shell: bash
        run: |
          mv artifacts/keepasscmd-win-x64/KeePassCmd.exe artifacts/keepasscmd-win-x64/KeePassCmd-v${{ env.VERSION }}-x64.exe
          mv artifacts/keepasscmd-win-arm64/KeePassCmd.exe artifacts/keepasscmd-win-arm64/KeePassCmd-v${{ env.VERSION }}-arm64.exe
          ls -lR artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/keepasscmd-win-x64/*.exe
            artifacts/keepasscmd-win-arm64/*.exe
